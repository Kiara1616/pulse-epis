name: Certification ETL

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: certification-etl
  cancel-in-progress: false

jobs:
  etl:
    runs-on: ubuntu-latest
    env:
      PULSE_ETL_BASE_URL: ${{ vars.PULSE_ETL_BASE_URL }}
      PULSE_ETL_SCHEDULER_SECRET: ${{ secrets.PULSE_ETL_SCHEDULER_SECRET }}
    steps:
      - name: Validate configuration
        shell: bash
        run: |
          test -n "$PULSE_ETL_BASE_URL" || { echo 'Missing PULSE_ETL_BASE_URL variable'; exit 1; }
          test -n "$PULSE_ETL_SCHEDULER_SECRET" || { echo 'Missing PULSE_ETL_SCHEDULER_SECRET secret'; exit 1; }

      - name: Run ETL inside Pulse EPIS service
        shell: bash
        run: |
          curl --silent --show-error --fail-with-body --retry 2 --retry-delay 15 --max-time 180 \
            --request POST \
            --header "X-Pulse-ETL-Secret: $PULSE_ETL_SCHEDULER_SECRET" \
            "${PULSE_ETL_BASE_URL%/}/api/v1/etl/scheduled" \
            --output etl-result.json
          python - <<'PY'
          import json
          with open("etl-result.json", encoding="utf-8") as result_file:
              result = json.load(result_file)
          print("status={status} reason={reason} period={period} cutoff={cutoff} run_id={run_id}".format(
              status=result.get("status"), reason=result.get("reason", ""),
              period=result.get("period_code", ""), cutoff=result.get("cutoff_date", ""),
              run_id=result.get("id", "")))
          PY

      - name: Preserve ETL result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: certification-etl-result
          path: etl-result.json
          if-no-files-found: warn
