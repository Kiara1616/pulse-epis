name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint -- --no-cache

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Audit npm dependencies
        run: npm audit --audit-level=high

  backend:
    name: backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pulse_epis
          POSTGRES_USER: pulse
          POSTGRES_PASSWORD: pulse
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PULSE_DATABASE_URL: postgresql+psycopg://pulse:pulse@localhost:5432/pulse_epis
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend and test dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Compile Python sources
        run: python -m compileall -q backend

      - name: Run ETL tests with coverage
        env:
          PYTHONPATH: .
        run: >-
          python -m pytest backend/tests
          --cov=backend.app
          --cov=backend.scripts_etl.main
          --cov-report=term-missing
          --cov-report=xml:backend/coverage.xml

      - name: Check installed dependency consistency
        run: python -m pip check

      - name: Audit Python dependencies
        run: pip-audit -r backend/requirements.txt

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: warn

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12

      - name: Validate local documentation links
        run: python scripts/validate_docs.py

      - name: Check whitespace changes
        run: git diff --check origin/main...HEAD

      - name: Validate dashboard contract JSON
        run: python -m json.tool docs/schemas/dashboard-spec.json > /dev/null

      - name: Package manuals
        run: |
          mkdir -p artifact/manuals
          cp README.md CONTRIBUTING.md artifact/manuals/
          cp -R docs artifact/manuals/docs
          tar -czf manuals.tar.gz -C artifact/manuals .

      - name: Upload manuals artifact
        uses: actions/upload-artifact@v4
        with:
          name: project-manuals
          path: manuals.tar.gz
          if-no-files-found: error

  containers:
    name: containers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        env:
          PULSE_POSTGRES_DB: pulse_epis
          PULSE_POSTGRES_USER: pulse
          PULSE_POSTGRES_PASSWORD: ci-only-password
          PULSE_AUTH_SESSION_SECRET: ci-only-session-secret-at-least-32-characters
          PULSE_ROSTER_PSEUDONYM_SECRET: ci-only-pseudonym-secret
          PULSE_EVIDENCE_ACCESS_SECRET: ci-only-evidence-secret
        run: docker compose config --quiet

      - name: Build container images
        env:
          PULSE_POSTGRES_DB: pulse_epis
          PULSE_POSTGRES_USER: pulse
          PULSE_POSTGRES_PASSWORD: ci-only-password
          PULSE_AUTH_SESSION_SECRET: ci-only-session-secret-at-least-32-characters
          PULSE_ROSTER_PSEUDONYM_SECRET: ci-only-pseudonym-secret
          PULSE_EVIDENCE_ACCESS_SECRET: ci-only-evidence-secret
        run: docker compose build backend frontend

      - name: Start stack and verify health
        env:
          PULSE_POSTGRES_DB: pulse_epis
          PULSE_POSTGRES_USER: pulse
          PULSE_POSTGRES_PASSWORD: ci-only-password
          PULSE_AUTH_SESSION_SECRET: ci-only-session-secret-at-least-32-characters
          PULSE_ROSTER_PSEUDONYM_SECRET: ci-only-pseudonym-secret
          PULSE_EVIDENCE_ACCESS_SECRET: ci-only-evidence-secret
        run: |
          docker compose up --detach --wait --wait-timeout 120
          curl --fail --retry 5 --retry-delay 2 http://localhost:8000/ready
          curl --fail --retry 5 --retry-delay 2 http://localhost:3000

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop stack
        if: always()
        run: docker compose down --volumes
