name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint -- --no-cache

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Audit npm dependencies
        run: npm audit --audit-level=high

  backend:
    name: backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend and test dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Compile Python sources
        run: python -m compileall -q backend

      - name: Run ETL tests with coverage
        env:
          PYTHONPATH: backend/scripts_etl
        run: >-
          python -m pytest backend/tests
          --cov=main
          --cov-report=term-missing
          --cov-report=xml:backend/coverage.xml

      - name: Check installed dependency consistency
        run: python -m pip check

      - name: Audit Python dependencies
        run: pip-audit -r backend/requirements.txt

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: warn

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12

      - name: Validate local documentation links
        run: python scripts/validate_docs.py

      - name: Check whitespace changes
        run: git diff --check origin/main...HEAD

      - name: Validate dashboard contract JSON
        run: python -m json.tool docs/schemas/dashboard-spec.json > /dev/null

      - name: Package manuals
        run: |
          mkdir -p artifact/manuals
          cp README.md CONTRIBUTING.md artifact/manuals/
          cp -R docs artifact/manuals/docs
          tar -czf manuals.tar.gz -C artifact/manuals .

      - name: Upload manuals artifact
        uses: actions/upload-artifact@v4
        with:
          name: project-manuals
          path: manuals.tar.gz
          if-no-files-found: error
