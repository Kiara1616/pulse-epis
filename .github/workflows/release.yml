name: Publish release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish"
        required: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12

      - name: Validate pilot and documentation
        run: |
          python scripts/validate_release.py
          python scripts/validate_docs.py
          python -m json.tool pilot/acceptance.json > /dev/null

      - name: Build manuals and diagrams
        run: |
          python -m pip install -r backend/requirements-dev.txt
          python scripts/build_docs.py

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body_path: pilot/RELEASE-NOTES.md
          files: |
            artifacts/docs/**
            pilot/acceptance.json
