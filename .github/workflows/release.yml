name: Publish release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish"
        required: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release publishing requires a vX.Y.Z tag; received: $RELEASE_TAG"
            exit 1
          fi

      - name: Checkout release
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12

      - name: Install documentation dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Validate pilot and documentation
        run: |
          python scripts/validate_release.py --strict
          python scripts/validate_docs.py
          python -m json.tool pilot/acceptance.json > /dev/null

      - name: Setup Node.js for Mermaid
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs/tooling/package-lock.json

      - name: Install Mermaid CLI
        run: npm ci --prefix docs/tooling

      - name: Build manuals and diagrams
        run: |
          python scripts/build_docs.py
          python scripts/validate_docs.py --artifacts

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body_path: pilot/RELEASE-NOTES.md
          files: |
            artifacts/docs/**
            pilot/acceptance.json
