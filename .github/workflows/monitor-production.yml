name: Monitor production

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  healthcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Check HTTPS and readiness
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 5 "https://${{ vars.PRODUCTION_DOMAIN }}/"
          curl --fail --silent --show-error --retry 3 --retry-delay 5 "https://${{ vars.PRODUCTION_DOMAIN }}/ready"
