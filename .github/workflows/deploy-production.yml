name: Deploy production

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit or tag to deploy"
        required: true
        default: main

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || vars.PRODUCTION_ENABLED == 'true'
    name: Approved production deployment
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://${{ vars.PRODUCTION_DOMAIN }}
    steps:
      - name: Enforce required production approval
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/environments/production" > /tmp/production-policy.json
          python -c 'import json; p=json.load(open("/tmp/production-policy.json")); assert any(r["type"] == "required_reviewers" for r in p["protection_rules"]), "Configure required reviewers on the production environment before deploying"'
      - name: Validate production ref
        env:
          DEPLOY_REF: ${{ inputs.ref || github.ref_name }}
        run: |
          if [[ "$DEPLOY_REF" != "main" && ! "$DEPLOY_REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Production accepts only main or a vX.Y.Z tag; received: $DEPLOY_REF"
            exit 1
          fi

      - name: Checkout selected revision
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref_name }}

      - name: Configure SSH
        env:
          PRODUCTION_SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          PRODUCTION_KNOWN_HOSTS: ${{ secrets.PRODUCTION_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$PRODUCTION_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          test -n "$PRODUCTION_KNOWN_HOSTS" || { echo 'Configure pinned PRODUCTION_KNOWN_HOSTS.'; exit 1; }
          printf '%s\n' "$PRODUCTION_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Copy release
        run: |
          ssh "${{ vars.PRODUCTION_USER }}@${{ vars.PRODUCTION_HOST }}" "mkdir -p '${{ vars.PRODUCTION_PATH }}'"
          tar -czf /tmp/pulse-epis-production.tar.gz compose.yaml backend dashboard-app deploy .dockerignore .env.compose.example
          scp /tmp/pulse-epis-production.tar.gz "${{ vars.PRODUCTION_USER }}@${{ vars.PRODUCTION_HOST }}:${{ vars.PRODUCTION_PATH }}/release.tar.gz"

      - name: Deploy and retain rollback release
        env:
          PRODUCTION_ENV_FILE: ${{ secrets.PRODUCTION_ENV_FILE }}
        run: |
          printf '%s\n' "$PRODUCTION_ENV_FILE" | ssh "${{ vars.PRODUCTION_USER }}@${{ vars.PRODUCTION_HOST }}" "umask 077; cat > '${{ vars.PRODUCTION_PATH }}/.env'"
          ssh "${{ vars.PRODUCTION_USER }}@${{ vars.PRODUCTION_HOST }}" <<'REMOTE'
          set -eu
          cd '${{ vars.PRODUCTION_PATH }}'
          exec 9>.operations.lock
          flock -w 300 9
          mkdir -p releases
          if [ -d current ]; then mv current "releases/previous-$(date -u +%Y%m%d%H%M%S)"; fi
          mkdir -p current
          tar -xzf release.tar.gz -C current
          cd current
          docker compose --env-file ../.env --profile staging up -d --build --wait --wait-timeout 180 --remove-orphans
          docker compose --env-file ../.env --profile staging exec -T backend alembic -c /app/backend/alembic.ini upgrade head
          REMOTE

      - name: Production smoke tests
        run: |
          curl --fail --retry 10 --retry-delay 5 --retry-all-errors "https://${{ vars.PRODUCTION_DOMAIN }}/"
          curl --fail --retry 10 --retry-delay 5 --retry-all-errors "https://${{ vars.PRODUCTION_DOMAIN }}/ready"
