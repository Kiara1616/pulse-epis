pid /tmp/pulse-nginx.pid;
error_log stderr crit;
events { worker_connections 1024; }
http {
  access_log off;
  client_body_temp_path /tmp/pulse-body;
  proxy_temp_path /tmp/pulse-proxy;
  fastcgi_temp_path /tmp/pulse-fastcgi;
  uwsgi_temp_path /tmp/pulse-uwsgi;
  scgi_temp_path /tmp/pulse-scgi;
  client_max_body_size 11m;
  server {
    listen __PORT__;
    location ~ ^/(api/|health$|ready$|openapi.json$|docs$|redoc$) {
      proxy_pass http://127.0.0.1:8000;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location / {
      proxy_pass http://127.0.0.1:3000;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
    }
  }
}
